## アプリケーション設定。キー・既定値の正は docs/tech/basic/tech_backend.md §4.2、
## 環境変数の正は docs/tech/nonfunctional/tech_operations.md §12.2（本ファイルはサンプル設定を兼ねる）。
##
## キーはドット区切りのみで組む（ハイフンは環境変数へ変換されないため）。
## 素の Spring の自動変換（database.url ↔ DATABASE_URL）とキー名が一致しない変数は、
## 値の側へ ${ENV:既定値} を書いて上書き先を明示する。

# == ゲーム進行 ==
afkgame.tick.interval.seconds=60
afkgame.turns.per.tick=3
afkgame.offline.efficiency=1.0
afkgame.max.offline.hours=24
afkgame.fast.calc.threshold=100
afkgame.max.battle.log.records=100
afkgame.max.log.per.response=50
afkgame.max.player.level=9999
afkgame.max.gold=9223372036854775807
# 戦闘乱数のシード。既定は未設定（tech_rng.md §2 の調査時のみ固定する）
afkgame.battle.rng.seed=${BATTLE_RNG_SEED:}

# == 認証（値の正は tech_auth.md §1、パスワード長は tech_security.md §11.3）==
# 署名鍵。既定値を置かない（未設定なら起動を中止する）。local の既定は local/afkgame-local.properties
afkgame.auth.secret=${JWT_SECRET}
afkgame.auth.access.token.expire.minutes=30
afkgame.auth.refresh.token.expire.days=30
afkgame.auth.bcrypt.strength=12
afkgame.auth.password.min.length=8
afkgame.auth.password.max.length=128
afkgame.auth.guest.expire.days=90

# == CORS（正は tech_security.md §11.2）。本番はワイルドカードを使わない ==
afkgame.cors.origins=${CORS_ORIGINS:http://localhost:5173}
