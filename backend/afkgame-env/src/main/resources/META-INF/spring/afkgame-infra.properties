## DB 接続とコネクションプール。既定値・環境変数の正は
## docs/tech/nonfunctional/tech_operations.md §12.2（本ファイルはサンプル設定を兼ねる）。

database.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/afkgame}
database.user=${DATABASE_USER:afkgame}
# 既定値を置かない（未設定なら起動を中止する）。local の既定は local/afkgame-local.properties
database.password=${DATABASE_PASSWORD}
database.driver.class.name=org.postgresql.Driver

# connection pool
cp.max.active=96
cp.max.idle=16
cp.min.idle=0
cp.max.wait=60000
