## local プロファイル専用の既定値（docs/tech/nonfunctional/tech_operations.md §12.1・§12.2）。
##
## production では読み込まれないため、必須変数が未設定ならプレースホルダを解決できず起動を中止する
## ＝設定漏れのまま本番稼働することを防ぐ。素の Spring には Boot の application-{profile} が無いため、
## @Profile("local") の LocalProfileConfig が @PropertySource で読み込む。
## META-INF/spring/*.properties のグロブ（非再帰）へ入らないよう、サブディレクトリに置くこと。

# DB はリポジトリ同梱の docker-compose.yml が起動する PostgreSQL（:5432）を既定とする
database.password=${DATABASE_PASSWORD:afkgame}

# HS256 の鍵長は32バイト以上が必要（RFC 7518 §3.2）
afkgame.auth.secret=${JWT_SECRET:afkgame-dev-secret-change-in-production}
