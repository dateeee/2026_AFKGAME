# production — 本番（tech_operations.md §12.1）
#
# 必須の環境変数に既定値を置かない。未設定のままだとプレースホルダを解決できず起動を中止するため、
# 設定漏れのまま本番稼働することを防ぐ（tech_operations.md §12.2 の起動時バリデーション）。

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

afkgame:
  auth:
    # 共通設定にも既定値は無いが、本番の必須変数を本ファイルに列挙して読み取れるようにする
    secret: ${JWT_SECRET}
