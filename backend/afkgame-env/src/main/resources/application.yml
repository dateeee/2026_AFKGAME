# AFK GAME — 環境非依存の共通設定
#
# 環境変数の一覧・既定値の正は docs/tech/nonfunctional/tech_operations.md §12.2。
# 変数を追加したら §12.2 の表と本ファイルを同時に更新する。
# 環境ごとの差分は application-local.yml / application-production.yml が持つ。

spring:
  application:
    name: afkgame
  profiles:
    # 環境の識別は APP_ENV（local / production）。tech_operations.md §12.1
    # 既定値を置かない。設定漏れのまま local として本番起動し、開発用の既定署名鍵が
    # 有効になるのを防ぐ（tech_operations.md §12.2）
    active: ${APP_ENV}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/afkgame}
    username: ${DATABASE_USER:afkgame}
    # 既定値を置かない。未設定なら起動を中止する（tech_operations.md §12.2）
    password: ${DATABASE_PASSWORD}
  flyway:
    # 起動時にマイグレーションを自動適用する（tech_operations.md §12.4 の適用手順③）
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # リクエストの未定義フィールドは 422 で拒否する（tech_api_common.md §5.0・tech_security.md §11.3）
      fail-on-unknown-properties: true
  mvc:
    # 未定義パスを例外にして、404 も統一エラー形式で返す（tech_logging.md「統一エラーレスポンス形式」）
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 静的リソースの探索を無効化し、未定義パスを確実に例外へ落とす（APIサーバーのため静的配信は行わない）
      add-mappings: false

mybatis:
  # Mapper XML は afkgame-domain の Mapper インタフェースと同じパッケージに置く
  mapper-locations: classpath*:com/afkgame/domain/repository/*.xml
  configuration:
    # DB列の snake_case を Java の camelCase へ対応づける（tech_db.md §2）
    map-underscore-to-camel-case: true

logging:
  level:
    # ロガー名体系は tech_logging.md「ロガー名体系」（afkgame.auth 等）。
    # クラス名ロガー（com.afkgame.*）と併用するため両方を LOG_LEVEL で制御する
    afkgame: ${LOG_LEVEL:INFO}
    com.afkgame: ${LOG_LEVEL:INFO}

# アプリケーション設定（tech_structure.md §4「設定値」が正）
afkgame:
  auth:
    # 署名鍵。既定値を置かない（未設定なら起動を中止する。tech_operations.md §12.2）
    secret: ${JWT_SECRET}
    access-token-expire: 30m     # アクセストークン有効期限（tech_auth.md §1）
    refresh-token-expire: 30d    # リフレッシュトークン有効期限（tech_auth.md §1）
  cors:
    # 許可オリジン（tech_security.md §11.2）。本番はワイルドカードを使わない
    origins: ${CORS_ORIGINS:http://localhost:5173}
  tick-interval-seconds: 60      # 1 tick の間隔（秒）
  turns-per-tick: 3              # 1 tick あたりのターン数
  offline-efficiency: 1.0        # オフライン時の報酬効率（オンラインと同一）
  max-offline-hours: 24          # オフライン報酬の最大蓄積時間
  fast-calc-threshold: 100       # これを超える（101以上の）未処理tickは簡略計算に切り替え
  max-battle-log-records: 100    # DB保持ログ件数上限
  max-log-per-response: 50       # 1レスポンスあたりのログ件数上限
  max-player-level: 9999         # プレイヤーLV上限
  max-gold: 9223372036854775807  # ゴールド上限（64bit符号付き整数最大値）
  # 戦闘乱数のシード。調査時のみ固定する（tech_rng.md §2）。未設定なら毎リクエストでランダム
  battle-rng-seed: ${BATTLE_RNG_SEED:}
