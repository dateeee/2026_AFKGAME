[pytest]
# 開発工程定義書 §3.5（単体テスト）/ §3.6（結合テスト）準拠
testpaths = tests
pythonpath = .
addopts =
    --cov=app
    --cov-branch
    --cov-report=term-missing:skip-covered
markers =
    unit: 単体テスト（services / master_data / routers の関数・分岐）
    integration: 結合テスト（APIシーケンス）
filterwarnings =
    ignore::DeprecationWarning
