# AFK GAME — キャラクタータイプ別 LV1 基礎ステータスのマスターデータ
#
# 数値の正は docs/data/master/character.md §1.2。スキーマの正は
# com.afkgame.domain.masterdata.CharacterTypeData（制約違反は起動時に検出して起動を中止する）。
# growth* は1LVあたりの上昇量（線形加算）。LV n のステータスは base + growth × (n - 1) を
# floor した値で、増分をLVごとに足し込まない（tech_numeric.md §5 #21）。小数を持つタイプが
# あるため double で受ける（holy の spd +1.5、agile の def +1.5）。
# critRate は Phase 1 の基礎値5%。味方と敵で供給元を分ける決まりのため、敵側は EnemyData の列が持つ
# （tech_rng.md §6）。Phase 3〜 は装備・スキルの合算をキャラクター側で持つ。
# 未知のキーは起動時に弾かれるため、先回りしてキーを足さないこと。

