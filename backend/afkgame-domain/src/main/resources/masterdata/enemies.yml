# AFK GAME — 敵のマスターデータ
#
# 列の正は docs/data/towers/000_テンプレート.md §2、数値の正は各塔ファイル §2。
# スキーマの正は com.afkgame.domain.masterdata.EnemyData（制約違反は起動時に検出して起動を中止する）。
# 敵データはグローバル定義で、塔ごとの所属情報は持たない。どの階に出るかは塔側の
# エンカウントプールが enemyId で参照する（docs/tech/basic/tech_data.md §1.2）。
# critRate は味方と供給元を分ける決まりのため敵側はここが正で、Phase 1 の既定は基礎値 0.05
# （tech_rng.md §6。味方側は character_types.yml の critRate 列）。
# 未知のキーは起動時に弾かれるため、先回りしてキーを足さないこと。
#
# 載せるのは対象 Phase までの塔の敵だけとし、Phase 2 以降の塔の敵は該当 Phase で足す
# （.claude/project/profile.md §5 不変条件5「Phase 厳守」）。

